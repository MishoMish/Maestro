; Маестро firmware
;   Build the game:     pio run
;   Upload the game:    pio run -t upload
;   Hardware test:      pio run -e hwtest -t upload
;   Game + serial log:  pio run -e debug -t upload, then pio device monitor
[platformio]
default_envs = uno

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
monitor_speed = 115200

[env:uno]

[env:debug]
build_flags = -DMAESTRO_DEBUG

[env:hwtest]
build_src_filter = -<*> +<../hwtest/>
