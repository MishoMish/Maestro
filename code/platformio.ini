; Маестро firmware
;   Build the game:     pio run
;   Upload the game:    pio run -t upload
;   Hardware test:      pio run -e hwtest -t upload
;   Game + serial log:  pio run -e debug -t upload, then pio device monitor
;   Self-test on chip:  ./maestro selftest
[platformio]
default_envs = uno

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
monitor_speed = 115200

[env:uno]

[env:debug]
build_flags = -DMAESTRO_DEBUG

[env:hwtest]
build_src_filter = -<*> +<../hwtest/>

; The real game with a scripted player, on the Uno's own processor. Needs nothing wired.
[env:selftest]
build_flags = -DMAESTRO_SELFTEST
build_src_filter = +<*> +<../selftest/>

; For running the self-test in the simulator, which doesn't model the watchdog reset.
[env:selftest_sim]
build_flags = -DMAESTRO_SELFTEST -DSELFTEST_SOFT_RESET
build_src_filter = +<*> +<../selftest/>

[env:selftest_short]
build_flags = -DMAESTRO_SELFTEST -DSELFTEST_SOFT_RESET -DSELFTEST_SHORT
build_src_filter = +<*> +<../selftest/>
